<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor d'Horaris - Rodalies de Catalunya</title>
  <style>
    :root {
      --line-color: #A90034;
      --line-light: #fbe6eb;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --text-muted: #7f8c8d;
      --border: #e2e8f0;
      --accent: #e67e22;
      --line-inactive: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 650px;
      width: 100%;
    }

    /* Selector de Mode (Per Línia / Per Estació) */
    .mode-selector {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Seccions de contingut */
    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    /* Selector de Línies */
    .line-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .line-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border);
      background: white;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .line-btn.active[data-line="R16"] {
      background: #A90034;
      color: white;
      border-color: #A90034;
    }

    .line-btn.active[data-line="R15"] {
      background: #93806B;
      color: white;
      border-color: #93806B;
    }

    /* Selector de Sentit */
    .dir-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .dir-btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .dir-btn.active {
      background: var(--line-color);
      color: white;
      border-color: var(--line-color);
    }

    .train-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .train-header {
      background: var(--line-color);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s;
    }

    .train-badge {
      background: rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .train-title h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .train-meta {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 15px 20px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .meta-item .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .meta-item .value {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text);
      margin-top: 2px;
    }

    .filter-box {
      padding: 15px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .filter-box select, .filter-box input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      outline: none;
    }

    /* Termòmetre Vertical */
    .timeline {
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .timeline-item {
      display: flex;
      align-items: flex-start;
      position: relative;
      padding-bottom: 28px;
    }

    .timeline-item:last-child {
      padding-bottom: 0;
    }

    .line-segment-top, .line-segment-bottom {
      position: absolute;
      left: 79px;
      width: 4px;
      z-index: 1;
    }

    .line-segment-top { top: 0; height: 50%; }
    .line-segment-bottom { top: 50%; bottom: 0; }

    .timeline-item:first-child .line-segment-top,
    .timeline-item:last-child .line-segment-bottom { display: none; }

    .line-active { background: var(--line-color); }
    .line-disabled { background: var(--line-inactive); }

    .time {
      width: 65px;
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--text);
      text-align: right;
      padding-right: 15px;
    }

    .node {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--line-color);
      margin-right: 20px;
      margin-top: 2px;
      z-index: 2;
      flex-shrink: 0;
    }

    .timeline-item.no-stop .node {
      border-color: var(--line-inactive);
      background: #f1f5f9;
      width: 10px;
      height: 10px;
      margin-left: 2px;
      margin-right: 22px;
    }

    .station-info { flex: 1; }
    .station-name { font-size: 0.95rem; font-weight: 600; }

    .timeline-item.no-stop .station-name {
      color: var(--text-muted);
      font-weight: normal;
    }

    .transfer-badge {
      display: inline-block;
      background: var(--line-light);
      color: var(--line-color);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }

    .duration-badge { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }
    .no-stop-text { font-size: 0.75rem; color: var(--text-muted); font-style: italic; margin-top: 2px; }

    /* Estils de la Cerca per Estació */
    .station-search-panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .upcoming-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .upcoming-card {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 6px solid var(--line-inactive);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .upcoming-time-box {
      text-align: right;
    }

    .departure-clock {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .countdown-badge {
      display: inline-block;
      background: #edf2f7;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 4px;
    }

    .countdown-badge.imminent {
      background: #fed7d7;
      color: #9b2c2c;
    }

    .line-tag {
      font-size: 0.75rem;
      font-weight: bold;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .info-footer {
      padding: 15px 20px;
      background: #fff8e6;
      border-top: 1px solid #ffeeba;
      font-size: 0.85rem;
      color: #856404;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Selector Mode Visualització -->
  <div class="mode-selector">
    <button class="mode-btn active" id="btnModeStation" onclick="switchMode('station')">🚉 Cerca per Estació</button>
    <button class="mode-btn" id="btnModeLine" onclick="switchMode('line')">🗺️ Consulta per Línia</button>
  </div>

  <!-- ================= VISTA PER ESTACIÓ ================= -->
  <div class="view-section active" id="viewStation">
    <div class="station-search-panel">
      <label style="font-size: 0.85rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase;">Selecciona l'estació:</label>
      <div class="search-row">
        <select id="stationSelect" onchange="searchUpcomingTrains()">
          <!-- Es carrega dinàmicament -->
        </select>
        <input type="time" id="timeInput" onchange="searchUpcomingTrains()" style="max-width: 120px;">
      </div>
    </div>

    <div class="upcoming-list" id="upcomingList">
      <!-- Llista de trens propers -->
    </div>
  </div>

  <!-- ================= VISTA PER LÍNvector ================= -->
  <div class="view-section" id="viewLine">
    <div class="line-selector">
      <button class="line-btn active" data-line="R16" onclick="switchLine('R16')">Línia R16</button>
      <button class="line-btn" data-line="R15" onclick="switchLine('R15')">Línia R15</button>
    </div>

    <div class="dir-selector" id="dirSelector">
      <button class="dir-btn active" data-dir="outbound" id="btnOutbound" onclick="setDirection('outbound')">Anada</button>
      <button class="dir-btn" data-dir="inbound" id="btnInbound" onclick="setDirection('inbound')">Tornada</button>
    </div>

    <div class="train-card">
      <div class="train-header" id="trainHeader">
        <div class="train-title">
          <h1 id="lineTitle">Carregant...</h1>
          <p id="routeTitle">-- ➔ --</p>
        </div>
        <span class="train-badge" id="trainCode">--</span>
      </div>

      <div class="train-meta">
        <div class="meta-item">
          <div class="label">Sortida</div>
          <div class="value" id="departureTime">--:--</div>
        </div>
        <div class="meta-item">
          <div class="label">Arribada</div>
          <div class="value" id="arrivalTime">--:--</div>
        </div>
        <div class="meta-item">
          <div class="label">Durada</div>
          <div class="value" id="totalDuration">--</div>
        </div>
      </div>

      <div class="filter-box">
        <select id="trainSelect" onchange="loadSelectedTrain()">
        </select>
      </div>

      <div class="timeline" id="timeline"></div>

      <div class="info-footer">
        ℹ️ Dades carregades dinàmicament des del fitxer JSON de la línia.
      </div>
    </div>
  </div>
</div>

<script>
  let linesData = {};
  let currentLineData = null;
  let currentDirection = "outbound";

  function parseTimeToMinutes(timeStr) {
    if (!timeStr) return null;
    const [h, m] = timeStr.split(':').map(Number);
    return h * 60 + m;
  }

  // Inicialitza l'hora actual a l'input HH:MM
  function setDefaultTime() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('timeInput').value = `${hh}:${mm}`;
  }

  // Canvi entre la cerca per estació i la vista per línia
  function switchMode(mode) {
    document.getElementById('btnModeStation').classList.toggle('active', mode === 'station');
    document.getElementById('btnModeLine').classList.toggle('active', mode === 'line');
    document.getElementById('viewStation').classList.toggle('active', mode === 'station');
    document.getElementById('viewLine').classList.toggle('active', mode === 'line');
  }

  // Carrega les dades inicials de totes dues línies
  async function initApp() {
    setDefaultTime();
    
    try {
      const [resR16, resR15] = await Promise.all([
        fetch('./R16.json'),
        fetch('./R15.json')
      ]);

      if (resR16.ok) linesData["R16"] = await resR16.json();
      if (resR15.ok) linesData["R15"] = await resR15.json();

      populateAllStations();
      switchLine("R16");
    } catch (err) {
      console.error("Error carregant les dades inicials:", err);
    }
  }

  // Opleix el selector amb totes les estacions úniques disponibles
  function populateAllStations() {
    const stationSet = new Set();

    Object.values(linesData).forEach(line => {
      const dirs = line.directions ? [line.directions.outbound, line.directions.inbound] : [{ trains: line.trains }];
      dirs.forEach(dir => {
        if (!dir || !dir.trains) return;
        dir.trains.forEach(train => {
          if (Array.isArray(train.route)) {
            train.route.forEach(stop => {
              if (stop.station) stationSet.add(stop.station);
            });
          }
        });
      });
    });

    const stationSelect = document.getElementById('stationSelect');
    stationSelect.innerHTML = "";
    
    Array.from(stationSet).sort().forEach(station => {
      const opt = document.createElement('option');
      opt.value = station;
      opt.textContent = station;
      stationSelect.appendChild(opt);
    });

    // Selecciona Tortosa per defecte si existeix
    if (stationSet.has("Tortosa")) stationSelect.value = "Tortosa";
    
    searchUpcomingTrains();
  }

  // Cerca i calcula les pròximes circulacions per a l'estació seleccionada
  function searchUpcomingTrains() {
    const selectedStation = document.getElementById('stationSelect').value;
    const selectedTime = document.getElementById('timeInput').value;
    const currentMinutes = parseTimeToMinutes(selectedTime);

    if (!selectedStation || currentMinutes === null) return;

    let upcoming = [];

    Object.values(linesData).forEach(line => {
      const dirs = line.directions ? [line.directions.outbound, line.directions.inbound] : [{ trains: line.trains }];
      
      dirs.forEach(dir => {
        if (!dir || !dir.trains) return;
        
        dir.trains.forEach(train => {
          const route = Array.isArray(train.route) ? train.route : [];
          const stopIndex = route.findIndex(s => s.station === selectedStation && s.stops && s.time);

          if (stopIndex !== -1) {
            const stopTimeMin = parseTimeToMinutes(route[stopIndex].time);
            
            // Filtrem trens des de l'hora seleccionada en endavant (fent marge de fins a mitjanit)
            let diff = stopTimeMin - currentMinutes;
            if (diff < 0) diff += 1440; // Per considerar trens de la matinada següent

            // Agafem les circulacions que passen en les properes 12 hores
            if (diff >= 0 && diff <= 720) {
              const activeStops = route.filter(s => s.stops && s.time);
              const origin = activeStops[0]?.station || 'Origen';
              const destination = activeStops[activeStops.length - 1]?.station || 'Destí';

              upcoming.push({
                line: line.line,
                lineColor: line.color,
                trainId: train.id,
                trainType: train.type,
                time: route[stopIndex].time,
                diffMinutes: diff,
                origin: origin,
                destination: destination,
                isDestination: (destination === selectedStation)
              });
            }
          }
        });
      });
    });

    // Ordenem per temps restant
    upcoming.sort((a, b) => a.diffMinutes - b.diffMinutes);
    renderUpcomingList(upcoming);
  }

  // Genera la llista visual de les pròximes eixides
  function renderUpcomingList(upcoming) {
    const listEl = document.getElementById('upcomingList');
    listEl.innerHTML = "";

    if (upcoming.length === 0) {
      listEl.innerHTML = `
        <div style="text-align: center; padding: 30px; color: var(--text-muted); background: white; border-radius: 10px; border: 1px solid var(--border);">
          No s'han trobat més circulacions previstes per avui a partir d'aquesta hora.
        </div>`;
      return;
    }

    upcoming.forEach(item => {
      const card = document.createElement('div');
      card.className = 'upcoming-card';
      card.style.borderLeftColor = item.lineColor;

      let countdownText = "";
      if (item.diffMinutes === 0) {
        countdownText = "Imminent";
      } else if (item.diffMinutes < 60) {
        countdownText = `En ${item.diffMinutes} min`;
      } else {
        const h = Math.floor(item.diffMinutes / 60);
        const m = item.diffMinutes % 60;
        countdownText = `En ${h}h ${m}m`;
      }

      card.innerHTML = `
        <div>
          <span class="line-tag" style="background:${item.lineColor}">${item.line}</span>
          <strong style="font-size: 1rem; display: block; margin-top: 2px;">
            ${item.isDestination ? `Final de trajecte (${item.origin} ➔ ${item.destination})` : `Destí: ${item.destination}`}
          </strong>
          <span style="font-size: 0.8rem; color: var(--text-muted);">
            Tren ${item.trainId} · ${item.trainType} (Origen: ${item.origin})
          </span>
        </div>
        <div class="upcoming-time-box">
          <div class="departure-clock">${item.time} h</div>
          <span class="countdown-badge ${item.diffMinutes <= 5 ? 'imminent' : ''}">${countdownText}</span>
        </div>
      `;

      listEl.appendChild(card);
    });
  }

  // --- LOGICA DE CONSULTA PER LÍNIA ---

  async function switchLine(lineKey) {
    document.querySelectorAll('.line-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.line === lineKey);
    });

    currentLineData = linesData[lineKey];
    if (!currentLineData) return;

    document.documentElement.style.setProperty('--line-color', currentLineData.color || '#A90034');
    document.documentElement.style.setProperty('--line-light', currentLineData.lightColor || '#fbe6eb');

    updateDirectionButtons();
    updateTrainList();
  }

  function setDirection(dir) {
    currentDirection = dir;
    document.querySelectorAll('.dir-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.dir === dir);
    });
    updateTrainList();
  }

  function updateDirectionButtons() {
    if (currentLineData && currentLineData.directions) {
      document.getElementById('btnOutbound').textContent = currentLineData.directions.outbound?.name || 'Anada';
      document.getElementById('btnInbound').textContent = currentLineData.directions.inbound?.name || 'Tornada';
    }
  }

  function updateTrainList() {
    if (!currentLineData) return;

    let trains = [];
    if (currentLineData.directions) {
      trains = currentLineData.directions[currentDirection]?.trains || [];
    } else if (Array.isArray(currentLineData.trains)) {
      trains = currentLineData.trains;
    }

    const trainSelect = document.getElementById('trainSelect');
    trainSelect.innerHTML = "";

    if (trains.length === 0) {
      const opt = document.createElement('option');
      opt.textContent = "No hi ha trens disponibles";
      trainSelect.appendChild(opt);
      renderEmptyState();
      return;
    }

    trains.forEach((train, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;

      const route = Array.isArray(train.route) ? train.route : [];
      const activeStops = route.filter(s => s.stops && s.time !== null);
      
      const origin = activeStops.length > 0 ? activeStops[0].station : 'Origen';
      const destination = activeStops.length > 0 ? activeStops[activeStops.length - 1].station : 'Destí';

      opt.textContent = `Tren ${train.id || idx + 1} - ${train.type || 'Regional'} (${origin} ➔ ${destination})`;
      trainSelect.appendChild(opt);
    });

    loadSelectedTrain();
  }

  function loadSelectedTrain() {
    if (!currentLineData) return;
    
    const trainIndex = document.getElementById('trainSelect').value || 0;
    
    let trains = [];
    if (currentLineData.directions) {
      trains = currentLineData.directions[currentDirection]?.trains || [];
    } else {
      trains = currentLineData.trains || [];
    }

    const train = trains[trainIndex];
    if (!train) return;

    const route = Array.isArray(train.route) ? train.route : [];
    
    document.getElementById('lineTitle').textContent = `Línia ${currentLineData.line || ''} - ${train.type || ''}`;
    document.getElementById('trainCode').textContent = `Tren ${train.id || ''}`;
    
    const activeStops = route.filter(stop => stop.stops && stop.time !== null);
    
    if (activeStops.length > 0) {
      const origin = activeStops[0];
      const destination = activeStops[activeStops.length - 1];
      
      document.getElementById('routeTitle').textContent = `${origin.station} ➔ ${destination.station}`;
      document.getElementById('departureTime').textContent = `${origin.time} h`;
      document.getElementById('arrivalTime').textContent = `${destination.time} h`;

      const startMin = parseTimeToMinutes(origin.time);
      const endMin = parseTimeToMinutes(destination.time);
      
      if (startMin !== null && endMin !== null) {
        let diff = endMin - startMin;
        if (diff < 0) diff += 1440;
        const h = Math.floor(diff / 60);
        const m = diff % 60;
        document.getElementById('totalDuration').textContent = `${h}h ${m}m`;
      } else {
        document.getElementById('totalDuration').textContent = '--';
      }
    } else {
      renderEmptyState();
    }

    renderTimeline(route);
  }

  function renderEmptyState() {
    document.getElementById('routeTitle').textContent = '-- ➔ --';
    document.getElementById('departureTime').textContent = '--:--';
    document.getElementById('arrivalTime').textContent = '--:--';
    document.getElementById('totalDuration').textContent = '--';
    document.getElementById('timeline').innerHTML = '';
  }

  function renderTimeline(route) {
    const timelineEl = document.getElementById("timeline");
    timelineEl.innerHTML = "";

    route.forEach((stop, index) => {
      const prevStop = route[index - 1];
      const nextStop = route[index + 1];

      const topActive = prevStop ? (stop.stops && prevStop.stops) : false;
      const bottomActive = nextStop ? (stop.stops && nextStop.stops) : false;

      let durationText = "";
      if (stop.stops && stop.time) {
        let nextIndex = index + 1;
        while (nextIndex < route.length && (!route[nextIndex].stops || !route[nextIndex].time)) {
          nextIndex++;
        }
        if (nextIndex < route.length && route[nextIndex].stops && route[nextIndex].time) {
          const currentMin = parseTimeToMinutes(stop.time);
          const nextMin = parseTimeToMinutes(route[nextIndex].time);
          if (currentMin !== null && nextMin !== null) {
            let diff = nextMin - currentMin;
            if (diff < 0) diff += 1440;
            durationText = `⏱️ ${diff} min fins a ${route[nextIndex].station}`;
          }
        }
      }

      const item = document.createElement("div");
      item.className = `timeline-item ${!stop.stops ? 'no-stop' : ''}`;

      item.innerHTML = `
        <div class="line-segment-top ${topActive ? 'line-active' : 'line-disabled'}"></div>
        <div class="line-segment-bottom ${bottomActive ? 'line-active' : 'line-disabled'}"></div>
        <div class="time">${stop.time || '--:--'}</div>
        <div class="node"></div>
        <div class="station-info">
          <div class="station-name">
            ${stop.station}
            ${stop.transfer ? `<span class="transfer-badge">${stop.transfer}</span>` : ''}
          </div>
          ${stop.stops 
            ? (durationText ? `<div class="duration-badge">${durationText}</div>` : '') 
            : `<div class="no-stop-text">No s'atura</div>`}
        </div>
      `;

      timelineEl.appendChild(item);
    });
  }

  // Execució inicial
  initApp();
</script>

</body>
</html>
